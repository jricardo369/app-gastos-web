# nginx interno de app-gastos (SPA Ionic/Angular).
# El reverse proxy de sitios-deploy-vjtech recorta el prefijo /app-gastos/
# antes de proxear, asi que aqui la app se sirve en la raiz (/).
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # index.html nunca se cachea: es quien apunta a los bundles con hash.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Assets con hash en el nombre: cache inmutable.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|ico|json|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas del router de Angular (/login, /tabs/..., etc.) -> index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}