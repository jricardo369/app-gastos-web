<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Control de Gastos</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- Acceso directo en la pantalla de inicio (PWA) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f3a5d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gastos" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="application-name" content="Gastos" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icon/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icon/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icon/apple-touch-icon-167.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icon/apple-touch-icon-152.png" />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

  <!-- Pantalla de carga inicial. Va inline (sin depender de los bundles) porque
       al abrir desde un acceso directo el telefono tarda en descargarlos y sin
       esto se veia la pantalla en blanco. Mismos colores y letras que la app. -->
  <style>
    html, body { background: #eef2f7; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: #eef2f7; transition: opacity .3s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-mark {
      width: 76px; height: 76px; border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      background: #0f3a5d; box-shadow: 0 4px 14px rgba(15, 58, 93, .18);
    }
    .splash-title {
      margin: 0; font-family: 'Comfortaa', system-ui, sans-serif;
      font-size: 20px; font-weight: 700; color: #0f3a5d;
    }
    .splash-sub {
      margin: 0; font-family: 'Nunito', system-ui, sans-serif;
      font-size: 12px; font-weight: 700; color: #6b7a90;
    }
    /* Barra indeterminada: no promete un avance falso, solo "algo pasa" */
    .splash-bar { width: 132px; height: 6px; border-radius: 999px; background: #e6eaf0; overflow: hidden; }
    .splash-bar span { display: block; height: 100%; width: 40%; border-radius: 999px; background: #0fb27a;
      animation: splash-slide 1.1s ease-in-out infinite; }
    @keyframes splash-slide { 0% { transform: translateX(-105%); } 100% { transform: translateX(255%); } }
    @media (prefers-reduced-motion: reduce) { .splash-bar span { animation: none; width: 100%; } }
  </style>
</head>

<body>
  <app-root></app-root>

  <div id="splash" aria-busy="true" role="status" aria-label="Cargando la aplicación">
    <div class="splash-mark">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3.5 7.5h17v11a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" />
        <path d="M3.5 7.5 5 5.5A2 2 0 0 1 6.6 4.6h10.8A2 2 0 0 1 19.4 5.5L20.5 7.5" />
        <path d="M15.5 13h2.5" />
      </svg>
    </div>
    <h1 class="splash-title">Control de Gastos</h1>
    <div class="splash-bar"><span></span></div>
    <p class="splash-sub">Cargando…</p>
  </div>

  <script>
    // Marca el instante en que se pinta y, si algo falla al arrancar Angular,
    // quita la pantalla de carga sola para no dejar al usuario ahi trabado.
    (function () {
      var splash = document.getElementById('splash');
      if (splash) splash.dataset.t0 = String(Date.now());
      setTimeout(function () {
        var el = document.getElementById('splash');
        if (el) { el.classList.add('hide'); setTimeout(function () { el.remove(); }, 350); }
      }, 10000);
    })();
  </script>

</body>

</html>
