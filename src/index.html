<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Control de Gastos</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- Acceso directo en la pantalla de inicio (PWA) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f3a5d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gastos" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="application-name" content="Gastos" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icon/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icon/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icon/apple-touch-icon-167.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icon/apple-touch-icon-152.png" />

  <!-- Las fuentes NO bloquean el primer pintado: se piden con baja prioridad y
       se activan al llegar. Si bloqueasen, la pantalla de carga tardaria mas en
       aparecer que la app, que es justo lo que se quiere evitar. -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" as="style" />
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" as="style" />
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" />
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" />

  <!-- Pantalla de carga inicial. Va inline (sin depender de los bundles) porque
       al abrir desde un acceso directo el telefono tarda en descargarlos y sin
       esto se veia la pantalla en blanco.
       Fondo navy igual al theme-color y al icono: asi la franja de estado no
       queda de otro color mientras carga. -->
  <style>
    html, body { background: #0f3a5d; }
    body { margin: 0; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #0f3a5d; transition: opacity .3s ease;
      /* Respeta el notch y la barra de gestos: el logo queda centrado en la
         zona utilizable, no debajo de ellas. */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-box {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      text-align: center; padding: 0 24px;
    }
    .splash-logo { display: block; }
    .splash-title {
      margin: 14px 0 0; font-family: 'Comfortaa', system-ui, -apple-system, sans-serif;
      font-size: 21px; font-weight: 700; letter-spacing: -0.01em; color: #ffffff;
    }
    .splash-tag {
      margin: 0; font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, .72);
    }
    /* Barra indeterminada: no promete un avance falso, solo "algo pasa".
       No se sabe cuanto falta, asi que un porcentaje mentiria. */
    .splash-bar {
      width: 140px; height: 6px; margin-top: 22px; border-radius: 999px;
      background: rgba(255, 255, 255, .16); overflow: hidden;
    }
    .splash-bar span {
      display: block; height: 100%; width: 38%; border-radius: 999px;
      background: #0fb27a; animation: splash-slide 1.15s ease-in-out infinite;
    }
    @keyframes splash-slide { 0% { transform: translateX(-105%); } 100% { transform: translateX(265%); } }
    .splash-sub {
      margin: 12px 0 0; font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, .6);
    }
    /* Sin animacion para quien la pidio desactivada: la barra queda llena y
       quieta, que sigue diciendo "estoy cargando". */
    @media (prefers-reduced-motion: reduce) {
      #splash { transition: none; }
      .splash-bar span { animation: none; width: 100%; }
    }
  </style>
</head>

<body>
  <!-- Primero en el body: es lo primero que el navegador pinta, antes incluso
       de que exista el componente de Angular. -->
  <div id="splash" role="status" aria-busy="true" aria-label="Cargando la aplicacion">
    <div class="splash-box">
      <!-- El mismo logo del icono, en SVG inline: no gasta ningun request más -->
      <svg class="splash-logo" width="104" height="104" viewBox="0 0 104 104" fill="none" aria-hidden="true">
        <circle cx="73" cy="31" r="31" fill="#1d7ab0" />
        <rect x="9" y="31" width="78" height="52" rx="17" fill="#ffffff" />
        <path d="M48 43v30" stroke="#0f3a5d" stroke-width="4.5" stroke-linecap="round" />
        <path d="M55 48c-3-3-11-2-11 3 0 5 11 5 11 10 0 5-8 5-11 3" stroke="#0f3a5d"
              stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1 class="splash-title">Control de Gastos</h1>
      <p class="splash-tag">Presupuesto y gastos por quincena</p>
      <div class="splash-bar"><span></span></div>
      <p class="splash-sub">Cargando…</p>
    </div>
  </div>

  <app-root></app-root>

  <script>
    // Marca el instante en que se pinta y, si algo falla al arrancar Angular,
    // quita la pantalla de carga sola para no dejar al usuario ahi trabado.
    (function () {
      var splash = document.getElementById('splash');
      if (splash) splash.dataset.t0 = String(Date.now());
      setTimeout(function () {
        var el = document.getElementById('splash');
        if (el) { el.classList.add('hide'); setTimeout(function () { el.remove(); }, 350); }
      }, 10000);
    })();
  </script>

</body>

</html>
