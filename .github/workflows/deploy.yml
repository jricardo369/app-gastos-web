name: Deploy App Gastos a EC2 (puerto 80 /app-gastos)

# Solo rama master
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Necesario para el build local de verificacion (npm ci necesita el repo)
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar secrets
        run: |
          set -e
          # EC2_HOST debe ser IP o DNS pelado, sin http://, sin puerto, sin slash final
          HOST="${{ secrets.EC2_HOST }}"
          if [ -z "$HOST" ]; then echo "::error::Falta secret EC2_HOST"; exit 1; fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then echo "::error::Falta secret EC2_USER"; exit 1; fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then echo "::error::Falta secret EC2_SSH_KEY"; exit 1; fi
          case "$HOST" in
            http*|*/*|*:*|*" "*) echo "::error::EC2_HOST inválido='$HOST'. Usa solo IP (ej 3.85.1.2) o DNS (ec2-...compute.amazonaws.com), sin http:// ni :puerto ni /"; exit 1;;
          esac
          echo "Host OK (longitud ${#HOST} chars). Intentando resolver DNS..."
          getent hosts "$HOST" || nslookup "$HOST" || (echo "::warning::No se pudo resolver $HOST desde el runner, revisa que la IP/DNS sea correcta y la instancia esté running"; exit 1)

      - name: Build local (verifica que la app compile)
        run: |
          set -e
          npm ci --no-audit --no-fund
          npm run build -- --configuration production --base-href /app-gastos/

      - name: Validar formato de la clave SSH
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
          PASSPHRASE: ${{ secrets.EC2_SSH_PASSPHRASE }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -e
          if [ -z "$KEY" ]; then echo "::error::EC2_SSH_KEY esta vacio"; exit 1; fi
          # CRLF rompe la autenticacion: el server rechaza una clave con \r
          if printf '%s' "$KEY" | grep -q $'\r'; then
            echo "::error::EC2_SSH_KEY tiene finales de linea CRLF. Rehaz el secret con solo LF."
            exit 1
          fi
          # Cabecera PEM valida (nunca mostrar el contenido)
          if ! printf '%s' "$KEY" | head -1 | grep -q 'BEGIN .*PRIVATE KEY'; then
            echo "::error::EC2_SSH_KEY no empieza con una cabecera PEM valida (BEGIN ... PRIVATE KEY). Revisa que pegaste la clave entera."
            exit 1
          fi
          # Clave cifrada: appleboy/ssh-action necesita el passphrase explicito
          if printf '%s' "$KEY" | grep -q 'ENCRYPTED'; then
            if [ -z "$PASSPHRASE" ]; then
              echo "::error::La clave esta cifrada y falta el secret EC2_SSH_PASSPHRASE."
              exit 1
            fi
            echo "Clave cifrada, se usara EC2_SSH_PASSPHRASE."
          fi
          echo "Clave OK: $(printf '%s' "$KEY" | grep -c .) lineas | usuario=$SSH_USER | host=$SSH_HOST"

      - name: Diagnostico del handshake SSH
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Cabecera y pie PEM completos (solo structural, no imprime la clave)
          if ! grep -q -- '-----END .*PRIVATE KEY-----' ~/.ssh/id_deploy; then
            echo "::error::La clave no tiene el pie PEM '-----END ... PRIVATE KEY-----'. Esta truncada."
            exit 1
          fi

          # Fingerprint que el servidor vera (publica, no es secreto)
          echo "== Fingerprint de la clave que se ofrece =="
          ssh-keygen -lf ~/.ssh/id_deploy || { echo "::error::No se pudo derivar la clave publica (formato invalido)"; exit 1; }

          echo "== Handshake (solo lineas de autenticacion) =="
          set +e
          ssh -vvv -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              -o IdentitiesOnly=yes -o PreferredAuthentications=publickey \
              -o ConnectTimeout=15 -i ~/.ssh/id_deploy \
              "$SSH_USER@$SSH_HOST" 'echo CONECTADO_OK' 2>&1 \
            | grep -Ei 'remote software|Authentications that can continue|Offering public key|Server accepts key|send_pubkey_test|denied|Permission denied|CONECTADO_OK|Authenticating to|Connection established|identity file' \
            | sed -E 's/(SHA256:)[A-Za-z0-9+\/=]+/\1<oculto>/g'
          echo "== exit code: ${PIPESTATUS[0]} =="

          echo "== Como comparar contra authorized_keys del EC2 =="
          echo "   ssh $SSH_USER@$SSH_HOST 'tail -1 ~/.ssh/authorized_keys'"
          echo "   Ese fingerprint debe coincidir con el de arriba."

      - name: Deploy por SSH al EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_SSH_PASSPHRASE }}
          port: 22
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.EC2_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then DEPLOY_DIR="$HOME/sitios/sitios-deploy-vjtech"; fi

            echo "== Actualizar repo de infra =="
            if [ -d "$DEPLOY_DIR/.git" ]; then
              cd "$DEPLOY_DIR"
              git fetch origin master
              git reset --hard origin/master
            else
              mkdir -p "$(dirname "$DEPLOY_DIR")"
              # Usa HTTPS público. Si el repo es privado, cambia a git@github.com:... con deploy key
              git clone --branch master https://github.com/jricardo369/sitios-deploy-vjtech.git "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            fi

            echo "== Deploy (build + proxy puerto 80) =="
            bash deploy.sh